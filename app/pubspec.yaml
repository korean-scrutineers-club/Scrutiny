name: scrutiny_app
description: A mobile app for motorsport scrutineers
publish_to: none
resolution: workspace

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  scrutiny_core:
    path: ../packages/core
  scrutiny_domain:
    path: ../packages/domain
  scrutiny_data:
    path: ../packages/data

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.4

flutter:
  uses-material-design: true
